<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Belajar Background Image</title>
    <style>
      ul {
        list-style-type: circle;
      }
      li {
        margin-bottom: 0.5rem;
      }
    </style>
  </head>
  <body>
    <h1>Background Image</h1>
    <hr />
    <ul>
      <li>
        Selain menggunakan Color, kita juga bisa menggunakan Background Image
        sebagai background
      </li>
      <li>
        Untuk menggunakan image sebagai background, kita bisa menggunakan
        property background-image
      </li>
      <li>
        <a
          href="https://developer.mozilla.org/en-US/docs/Web/CSS/background-image"
          >Dokumentasi background-image</a
        >
      </li>
    </ul>
  </body>
</html>
