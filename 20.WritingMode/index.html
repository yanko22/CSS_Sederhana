<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Writing Mode</title>
  </head>
  <body>
    <h1>Writing Mode</h1>
    <hr />
    <ul>
      <li>
        Writing mode digunakan untuk menentukan cara memberikan text, apakah
        ingin horizontal atau vertical
      </li>
      <li>Kita bisa mengubah menggunakan property writing-mode</li>
      <li>
        <a
          href="https://developer.mozilla.org/en-US/docs/Web/CSS/writing-mode"
          target="_blank"
          >Writing Mode</a
        >
      </li>
    </ul>
    <p>contoh penggunaannya</p>
    <div class="percobaan1">
      <p>tanpa menggunakan writing-mode</p>
      <p style="writing-mode: vertical-lr">menggunakan writing-mode</p>
    </div>
  </body>
</html>
